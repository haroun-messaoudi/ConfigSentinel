services:

  postgres:
    image: postgres:17.10
    container_name: configguard_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7.4
    container_name: configguard_redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: configguard_django
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - default
      - clab
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: configguard_celery
    restart: unless-stopped
    command: celery -A core worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - default
      - clab
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: configguard_celery_beat
    restart: unless-stopped

    command: celery -A core beat -l info

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  postgres_data:
networks:
  clab:
    external: true
